<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassette Player</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="deck" id="deck">
  <div class="brand"><span><i class="led"></i>STEREO CASSETTE DECK</span>
    <span class="brand-r"><button class="lang" id="lang" data-t-aria="language"><span data-l="en">EN</span><span data-l="th">TH</span></button>Orniki - 9535</span></div>

  <section class="tapeside" data-t-aria="tapeSection">
  <div class="well out" id="well">
    <svg class="mech" viewBox="0 0 160 100" aria-hidden="true">   <!-- the deck's insides, seen through the door when no tape is in -->
      <defs><radialGradient id="spin"><stop offset=".35" stop-color="#9a9a9a"/><stop offset="1" stop-color="#3a3a3a"/></radialGradient>
        <linearGradient id="metal" x2="0" y2="1"><stop offset="0" stop-color="#d8d8d8"/><stop offset="1" stop-color="#6a6a6a"/></linearGradient>
        <g id="spindle"><circle r="9" fill="#151515" stroke="#3c3c3c"/><circle r="5.2" fill="url(#spin)"/>
          <path d="M0-5.6V5.6M-4.85-2.8 4.85 2.8M-4.85 2.8 4.85-2.8" stroke="#cfcfcf" stroke-width="1.4"/><circle r="1.6" fill="#222"/></g>
        <g id="guide"><rect x="-3" width="6" height="80" rx="1.5" fill="#202020" stroke="#383838"/>
          <path d="M-3 18h6M-3 40h6M-3 62h6" stroke="#0c0c0c" stroke-width="2"/></g></defs>
      <use href="#guide" x="6" y="10"/><use href="#guide" x="154" y="10"/>
      <use href="#spindle" x="55.85" y="57.8"/><use href="#spindle" x="104.15" y="57.8"/>
      <rect x="66" y="34" width="28" height="11" rx="2" fill="#101010" stroke="#333"/>
      <rect x="70" y="84" width="20" height="13" rx="1.5" fill="url(#metal)"/><path d="M80 84v13" stroke="#333" stroke-width=".8"/>
      <rect x="50" y="88" width="9" height="8" rx="1" fill="url(#metal)"/>
      <circle cx="40" cy="90" r="4.5" fill="#0d0d0d" stroke="#2c2c2c"/><circle cx="120" cy="90" r="4.5" fill="#0d0d0d" stroke="#2c2c2c"/>
      <circle cx="33" cy="91" r="1.4" fill="#ccc"/><circle cx="127" cy="91" r="1.4" fill="#ccc"/>
      <circle cx="64" cy="92" r="1.6" fill="#777"/><circle cx="96" cy="92" r="1.6" fill="#777"/>
    </svg>
    <div class="cassette screws" id="cassette">
      <div class="label">
        <div class="side">A</div>
        <div class="title"><span id="title">...</span></div>
        <div class="window">
          <div class="reel"><div class="tape"></div><div class="hub"></div></div>
          <div class="reel"><div class="tape"></div><div class="hub"></div></div>
          <svg class="strand" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M78 45 C70 95 58 15 50 65 S38 105 30 92" vector-effect="non-scaling-stroke"/></svg>
        </div>
      </div>
    </div>
    <div class="door" id="door"></div>   <!-- smoky glass; tips open on its bottom hinge while a tape goes in or out -->
  </div>

  <div class="keys">
    <button id="pause" data-t-aria="pause" data-t-title="pauseTip"><i class="bi bi-pause-fill" aria-hidden="true"></i></button>
    <button id="prev" data-t-aria="prev" data-t-title="prevTip"><i class="bi bi-skip-start-fill" aria-hidden="true"></i></button>
    <button id="rew" data-t-aria="rew" data-t-title="rewTip"><i class="bi bi-rewind-fill" aria-hidden="true"></i></button>
    <button id="play" data-t-aria="play" data-t-title="play"><i class="bi bi-play-fill" aria-hidden="true"></i></button>
    <button id="ff" data-t-aria="ff" data-t-title="ffTip"><i class="bi bi-fast-forward-fill" aria-hidden="true"></i></button>
    <button id="next" data-t-aria="next" data-t-title="nextTip"><i class="bi bi-skip-end-fill" aria-hidden="true"></i></button>
    <button id="stop" data-t-aria="stop" data-t-title="stopTip"><i class="bi bi-stop-fill" aria-hidden="true"></i><i class="bi bi-eject-fill" aria-hidden="true"></i></button>
    <button id="loop" data-t-aria="loop" data-t-title="loopTip" aria-pressed="false"><b><i class="bi bi-arrow-repeat" aria-hidden="true"></i></b><i class="lamp"></i></button>
  </div>

  <div class="meta">
    <span class="count"><small>COUNTER</small><span class="counter" id="counter" aria-hidden="true"></span>
      <button class="zero" id="zero" data-t-aria="zero" data-t-title="zero"></button></span>
  </div>

  </section>

  <section class="settings" data-t-aria="settingsSection">
  <div class="group">
    <h2 data-t="hLoad"></h2>
    <div class="row">
      <input type="text" id="url" data-t-aria="url" data-t-ph="urlHint">
      <span class="btns"><button class="load" id="load" data-t="insert"></button>
      <button class="load" id="pick" data-t="file" data-t-title="fileTip"></button></span>
      <input type="file" id="file" accept="audio/*" hidden>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <div class="group">
    <h2 data-t="hSound"></h2>
    <div class="sliders">
      <label class="has-tip"><span class="lbl"><span data-t="vol"></span> <span class="tip" aria-hidden="true">?</span><span class="tip-text" role="tooltip" id="tip-vol" data-t="tipVol"></span></span> <input type="range" id="vol" min="0" max="100" value="80" aria-describedby="tip-vol"></label>
      <label class="has-tip"><span class="lbl"><span data-t="hiss"></span> <span class="tip" aria-hidden="true">?</span><span class="tip-text" role="tooltip" id="tip-hiss" data-t="tipHiss"></span></span> <input type="range" id="hiss" min="0" max="100" value="35" aria-describedby="tip-hiss"></label>
    </div>
  </div>

  <div class="group">
    <h2 class="has-tip tip-r"><span data-t="hOld"></span> <span class="tag" id="fxTag" data-t="filesOnly"></span>
      <button class="mini" id="ab" aria-pressed="false" disabled data-t="ab" aria-describedby="tip-ab"></button><span class="tip" aria-hidden="true">?</span><span class="tip-text" role="tooltip" id="tip-ab" data-t="tipAb"></span></h2>
    <div class="sliders">
      <label class="has-tip"><span class="lbl"><span data-t="wow"></span> <span class="tip" aria-hidden="true">?</span><span class="tip-text" role="tooltip" id="tip-wow" data-t="tipWow"></span></span> <input type="range" id="wow" min="0" max="100" value="50" aria-describedby="tip-wow" disabled></label>
      <label class="has-tip"><span class="lbl"><span data-t="age"></span> <span class="tip" aria-hidden="true">?</span><span class="tip-text" role="tooltip" id="tip-age" data-t="tipAge"></span></span> <input type="range" id="age" min="0" max="100" value="60" aria-describedby="tip-age" disabled></label>
    </div>
  </div>

  <div class="group switches">
    <h2 data-t="hOpts"></h2>
    <label class="switch has-tip"><input type="checkbox" id="snap" checked aria-describedby="tip-snap"> <span data-t="snap"></span> <span class="tip" aria-hidden="true">?</span><span class="tip-text" role="tooltip" id="tip-snap" data-t="tipSnap"></span></label>
    <label class="switch" data-t-title="skipTip"><input type="checkbox" id="skip" disabled> <span data-t="skip"></span></label>
  </div>
  </section>
</div>

<div class="tv off" id="tv">   <!-- outside the deck, centred below it; shows only while a YouTube tape is in -->
  <small data-t="hYt"></small>
  <div class="monitor" id="monitor"><div id="yt"></div></div>
</div>

<!-- engine: sound, music sources and the deck mechanism (never touches the page) -->
<script src="js/engine/sound.js"></script>
<script src="js/engine/fx.js"></script>
<script src="js/engine/sources.js"></script>
<script src="js/engine/deck.js"></script>
<!-- ui: how the deck looks, and how clicks/sliders reach the engine -->
<script src="js/ui/i18n.js"></script>
<script src="js/ui/view.js"></script>
<script src="js/ui/controls.js"></script>
</body>
</html>

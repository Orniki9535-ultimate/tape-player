<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เครื่องเล่นเทป</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="deck" id="deck">
  <div class="brand"><span><i class="led"></i>STEREO CASSETTE DECK</span><span>Orniki - 9535</span></div>

  <section class="tapeside" aria-label="เทป">
  <div class="well out" id="well">
    <div class="empty">NO TAPE</div>
    <div class="cassette screws" id="cassette">
      <div class="label">
        <div class="side">A</div>
        <div class="title"><span id="title">...</span></div>
        <div class="window">
          <div class="reel"><div class="tape"></div><div class="hub"></div></div>
          <div class="reel"><div class="tape"></div><div class="hub"></div></div>
          <svg class="strand" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M78 45 C70 95 58 15 50 65 S38 105 30 92" vector-effect="non-scaling-stroke"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="keys">
    <button id="pause" aria-label="พัก" title="พัก (กดอีกครั้งเพื่อเล่นต่อ)"><i class="bi bi-pause-fill" aria-hidden="true"></i></button>
    <button id="rew" aria-label="กรอกลับ" title="กดค้างเพื่อกรอกลับ"><i class="bi bi-rewind-fill" aria-hidden="true"></i></button>
    <button id="play" aria-label="เล่น" title="เล่น"><i class="bi bi-play-fill" aria-hidden="true"></i></button>
    <button id="ff" aria-label="กรอไปข้างหน้า" title="กดค้างเพื่อกรอไปข้างหน้า"><i class="bi bi-fast-forward-fill" aria-hidden="true"></i></button>
    <button id="next" aria-label="เพลงถัดไป" title="เพลงถัดไป (เพลย์ลิสต์)"><i class="bi bi-skip-end-fill" aria-hidden="true"></i></button>
    <button id="stop" aria-label="หยุด / ดีดเทปออก" title="หยุด — กดตอนหยุดอยู่เพื่อดีดเทปออก"><i class="bi bi-stop-fill" aria-hidden="true"></i><i class="bi bi-eject-fill" aria-hidden="true"></i></button>
    <button id="loop" aria-label="เล่นวนซ้ำ" aria-pressed="false" title="วนซ้ำ — เล่นจบม้วนแล้วกรอกลับไปเล่นใหม่เอง"><b><i class="bi bi-arrow-repeat" aria-hidden="true"></i></b><i class="lamp"></i></button>
  </div>

  <div class="meta">
    <span class="count"><small>COUNTER</small><span class="counter" id="counter" aria-hidden="true"></span>
      <button class="zero" id="zero" aria-label="รีเซ็ตตัวนับ" title="รีเซ็ตตัวนับ"></button></span>
  </div>
  </section>

  <section class="settings" aria-label="การตั้งค่า">
  <div class="group">
    <h2>ใส่เทป</h2>
    <div class="row">
      <input type="text" id="url" aria-label="ลิงก์ YouTube" placeholder="วางลิงก์ YouTube หรือลากไฟล์เสียงมาวาง">
      <span class="btns"><button class="load" id="load">ใส่เทป</button>
      <button class="load" id="pick" title="เลือกไฟล์เสียงจากเครื่อง (ได้เสียงเทปยานของจริง)">ไฟล์</button></span>
      <input type="file" id="file" accept="audio/*" hidden>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <div class="group">
    <h2>เสียง</h2>
    <div class="sliders">
      <label>เสียงเพลง <input type="range" id="vol" min="0" max="100" value="80"></label>
      <label>เสียงซ่า <input type="range" id="hiss" min="0" max="100" value="35"></label>
    </div>
  </div>

  <div class="group">
    <h2>เสียงเทปเก่า <span class="tag">ไฟล์เสียงเท่านั้น</span> <button class="mini" id="ab" aria-pressed="false" disabled title="กดสลับฟังเสียงต้นฉบับ (ไม่ผ่านเอฟเฟกต์ ไม่มีเสียงซ่า) เทียบกับเสียงผ่านเครื่อง — ใช้ได้กับไฟล์เสียงเท่านั้น">ต้นฉบับ</button></h2>
    <div class="sliders">
      <label title="เสียงแกว่งแบบเทปยาน — ใช้ได้กับไฟล์เสียงเท่านั้น">เทปยาน <input type="range" id="wow" min="0" max="100" value="50" disabled></label>
      <label title="เสียงทึบ อิ่มตัว และวูบหายแบบเทปเก่า — ใช้ได้กับไฟล์เสียงเท่านั้น">ความเก่า <input type="range" id="age" min="0" max="100" value="60" disabled></label>
    </div>
  </div>

  <div class="group switches">
    <h2>ตัวเลือก</h2>
    <label class="switch" title="ระหว่างเล่น เทปอาจขาดได้ทุกเมื่อ — เพลงจะเงียบไปพักนึงแล้วค่อยๆ ดังกลับมาเอง"><input type="checkbox" id="snap" checked> ✂ เทปขาดแบบสุ่ม</label>
    <label class="switch" title="ตอนวนซ้ำ ไม่ต้องรอกรอกลับ — กลับไปต้นม้วนแล้วเล่นเลย"><input type="checkbox" id="skip" disabled> ข้ามการกรอกลับ</label>
  </div>

  <div class="group screen">
    <h2>จอ YouTube</h2>
    <div class="monitor" id="monitor"><div id="yt"></div></div>
  </div>
  </section>
</div>

<!-- engine: sound, music sources and the deck mechanism (never touches the page) -->
<script src="js/engine/sound.js"></script>
<script src="js/engine/sources.js"></script>
<script src="js/engine/deck.js"></script>
<!-- ui: how the deck looks, and how clicks/sliders reach the engine -->
<script src="js/ui/view.js"></script>
<script src="js/ui/controls.js"></script>
</body>
</html>
